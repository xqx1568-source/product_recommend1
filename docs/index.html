<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>🔥 男装 P0 丰富度货盘 🔥</title>
<style>
  :root {
    /* 紫粉渐变主题 */
    --grad-a:#6D5BD0;
    --grad-b:#E85D75;
    --brand-strong:#4A3AA0;
    --brand-soft:#EEEAFB;
    --ink:#1B1B2E;
    --ink-soft:#4A4A63;
    --muted:#7F7F95;
    --line:#E5E4EE;
    --line-soft:#EFEEF5;
    --bg:#F5F5F8;
    --card:#FFFFFF;
    --p0:#E85D75;
    --gpm:#6D5BD0;
    --aff:#00B894;
    --hot:#ff6a00;
    --sps-bg:#FFF2E8;
    --sps-fg:#C85D23;
    --shadow-sm: 0 1px 2px rgba(27,27,46,.05), 0 1px 3px rgba(27,27,46,.04);
    --shadow-md: 0 4px 14px rgba(74,58,160,.08), 0 2px 6px rgba(27,27,46,.05);
    --shadow-lg: 0 20px 50px rgba(27,27,46,.22), 0 6px 18px rgba(27,27,46,.12);
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
                 "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    background: var(--bg);
  }
  a { color: inherit; text-decoration: none; }

  /* ===== Header (紫粉渐变) ===== */
  .hero {
    position: relative;
    background: linear-gradient(135deg, var(--grad-a) 0%, var(--grad-b) 100%);
    padding: 34px 40px 40px;
    color:#fff;
    overflow:hidden;
  }
  .hero::before {
    content:""; position:absolute; inset:0;
    background:
      radial-gradient(circle at 15% 20%, rgba(255,255,255,.18), transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(255,255,255,.12), transparent 45%);
    pointer-events:none;
  }
  .hero-row {
    position:relative; z-index:1;
    display:flex; justify-content:space-between; align-items:flex-end;
    gap:24px; flex-wrap:wrap;
  }
  .hero h1 {
    margin:0; font-size:30px; letter-spacing:.5px; font-weight:700;
    text-shadow: 0 2px 8px rgba(0,0,0,.15);
  }
  .hero .sub { margin-top:8px; font-size:13px; opacity:.9; letter-spacing:.3px; }
  .hero-actions { display:flex; gap:10px; }
  .hero-actions button {
    background: rgba(255,255,255,.95); color: var(--brand-strong);
    border:0; border-radius:10px;
    padding:10px 18px; font-size:13px; font-weight:600; cursor:pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,.12);
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .hero-actions button:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(0,0,0,.18); }
  .hero-actions button.ghost {
    background: rgba(255,255,255,.14); color:#fff; backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,.35);
  }

  /* ===== Tabs ===== */
  .tabs {
    display:flex; gap:24px; padding: 0 40px;
    background:#fff; border-bottom:1px solid var(--line);
    box-shadow: var(--shadow-sm);
  }
  .tab {
    padding:14px 4px; font-size:14px; color:var(--muted); cursor:pointer;
    border-bottom:3px solid transparent; transition: color .15s;
  }
  .tab:hover { color: var(--ink-soft); }
  .tab.active { color: var(--brand-strong); border-bottom-color: var(--grad-a); font-weight:600; }
  .tab .badge {
    display:inline-block; min-width:20px; padding:0 6px; margin-left:4px;
    background: var(--brand-soft); color: var(--brand-strong);
    border-radius:10px; font-size:11px; font-weight:600; text-align:center;
  }

  /* ===== Filter bar (卡片式) ===== */
  .filters-wrap { padding: 20px 40px 0; }
  .filters {
    background:#fff; padding: 16px 18px; border-radius:14px;
    display:flex; gap:12px; align-items:flex-end; flex-wrap:wrap;
    box-shadow: var(--shadow-md);
  }
  .filter-field { display:flex; flex-direction:column; gap:5px; flex: 0 1 142px; min-width:128px; }
  .filter-field.search-field { flex: 1 1 260px; min-width:220px; }
  .filter-field label { font-size:11px; color:#666; line-height:1; padding-left:2px; }
  .filters input, .filters select {
    width:100%; height:38px; border:1px solid var(--line); border-radius:10px; padding: 0 12px;
    font-size:13px; background:#fff; color:var(--ink); outline:none;
    transition: border-color .15s, box-shadow .15s;
  }
  .filters input:focus, .filters select:focus {
    border-color: var(--grad-a);
    box-shadow: 0 0 0 3px rgba(109,91,208,.15);
  }
  .filters select { padding-right: 28px; cursor:pointer; }
  .filters .refresh, .filters .reset {
    color:#fff; border:0; padding: 0 18px; height:38px; border-radius:10px;
    font-weight:600; font-size:13px; cursor:pointer;
    transition: transform .12s, box-shadow .12s;
  }
  .filters .refresh {
    background: linear-gradient(135deg, var(--grad-a), var(--grad-b));
    box-shadow: 0 2px 8px rgba(109,91,208,.35);
  }
  .filters .reset {
    background:#fff; color:var(--brand-strong); border:1px solid var(--line);
  }
  .filters .refresh:hover, .filters .reset:hover { transform: translateY(-1px); }
  .filters .reset:hover { border-color:var(--grad-a); background:var(--brand-soft); }
  .filters .datacsv { margin-left:auto; color:var(--muted); font-size:12px; padding-bottom:10px; }

  /* ===== Sub actions ===== */
  .sub-actions {
    display:flex; gap:10px; padding: 14px 40px 0;
  }
  .sub-actions button {
    background:#fff; border:1px solid var(--line); padding: 7px 14px; border-radius:8px;
    font-size:12px; cursor:pointer; color: var(--ink-soft);
    transition: background .12s, border-color .12s;
  }
  .sub-actions button:hover { background: var(--brand-soft); border-color: var(--grad-a); color: var(--brand-strong); }

  /* ===== Stat cards ===== */
  .stats { display:grid; grid-template-columns: repeat(4, 1fr); gap:14px; padding: 18px 40px; }
  .stat {
    background:#fff; border-radius:14px; padding: 16px 20px;
    box-shadow: var(--shadow-sm);
    display:flex; flex-direction: column; gap:4px;
    border: 1px solid var(--line-soft);
    position: relative; overflow:hidden;
  }
  .stat::before {
    content:""; position:absolute; left:0; top:0; bottom:0; width:4px;
    background: linear-gradient(180deg, var(--grad-a), var(--grad-b));
    opacity:.85;
  }
  .stat .num { font-size:26px; font-weight:700; color: var(--ink); }
  .stat .num.small { font-size:15px; font-weight:700; color: var(--brand-strong); }
  .stat .label { color: var(--muted); font-size:12px; }

  /* ===== Product grid ===== */
  .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap:16px; padding: 0 40px 40px; }
  .card {
    background:#fff; border:1px solid var(--line-soft); border-radius:14px; overflow:hidden;
    display:flex; flex-direction:column; cursor: pointer;
    transition: transform .15s ease, box-shadow .18s ease, border-color .15s;
  }
  .card:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
    border-color: rgba(109,91,208,.35);
  }
  .card.picked {
    border-color: rgba(109,91,208,.72);
    box-shadow: 0 0 0 2px rgba(109,91,208,.12), var(--shadow-sm);
  }
  .card .cover {
    position:relative;
    width:100%;
    aspect-ratio: 1 / 1;
    background:#F2F0F7;
    overflow:hidden;
  }
  @supports not (aspect-ratio: 1 / 1) {
    .card .cover { height: 0; padding-top: 100%; }
  }
  .card .cover img {
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit: cover; display:block;
    background:#F2F0F7;
  }
  .card .cover .noimg {
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    color:#bbb; font-size:12px;
    background:#F2F0F7;
  }
  .card .cover .badges { position:absolute; left:8px; top:8px; display:flex; gap:6px; flex-wrap:wrap; }
  .card .cover .select {
    position:absolute; right:8px; top:8px;
    background: rgba(27,27,46,.7); color:#fff; font-size:11px; font-weight:600;
    padding: 5px 10px; border-radius: 14px; cursor:pointer;
    backdrop-filter: blur(6px);
  }
  .card .cover .select.on { background: linear-gradient(135deg, var(--grad-a), var(--grad-b)); }
  .card .body { padding: 12px 14px 14px; display:flex; flex-direction:column; gap:6px; font-size:12px; color: var(--ink-soft); }
  .card .body .lbl { color: var(--muted); margin-right:4px; }
  .card .pid-line { font-size:12px; }
  .card .pid-line a { font-weight:600; color: var(--brand-strong); }
  .card .pid-line a:hover { text-decoration: underline; }
  .card .pname {
    font-size:12px; color: var(--ink); line-height:1.4; font-weight:500;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
    overflow:hidden; text-overflow:ellipsis;
  }
  .card .shop, .card .cat { font-size:12px; color: var(--ink-soft); }
  .card .price-row { display:flex; align-items:center; justify-content:space-between; }
  .card .price b { color: var(--p0); font-size:15px; font-weight:700; }
  .card .tags { display:flex; gap:4px; flex-wrap:wrap; }
  .tag {
    display:inline-block; font-size:11px; padding: 2px 8px; border-radius:10px;
    background: var(--line-soft); color: var(--ink-soft); white-space: nowrap;
  }
  .tag.p0 { background: #FDECEF; color: var(--p0); font-weight:600; }
  .tag.gpm-hi { background: #EAE5FA; color: var(--gpm); font-weight:600; }
  .tag.gpm-mid { background: #EFEAFB; color: #7A6ED5; }
  .tag.gpm-lo { background: #EFEEF5; color: var(--muted); }
  .tag.aff { background: #E5F8F0; color: var(--aff); }
  .tag.rank { background: var(--ink); color:#fff; font-weight:700; }
  .tag.sps {
    background: var(--sps-bg); color: var(--sps-fg); border-radius:3px;
    padding:1px 5px; font-size:11px; border:0;
  }
  .tag.sps b { font-weight:600; }
  .tag.vid { background:#F3EAFC; color:#8A2BE2; }
  .tag.jit { background:#E8F4FF; color:#1E6EEB; font-weight:600; }
  .tag.combo { background:#FFF3D6; color:#B87B00; font-weight:600; }
  .card .foot { font-size:11px; color: var(--muted); }
  .card .country-lines { display:flex; flex-direction:column; gap:3px; font-size:12px; }
  .card .listed-countries { color: var(--muted); font-size:11px; line-height:1.35; }
  .card .listed-countries .lbl { font-size:11px; }
  .card .current-country { color: var(--brand-strong); font-weight:600; }
  .card .current-country .lbl { color: var(--brand-strong); }
  .card .rank-line { font-size:12px; color: var(--ink-soft); display:flex; gap:6px; align-items:center; }
  .card .multi-country {
    display:inline-flex; align-items:center; gap:4px;
    font-size:11px; color: var(--brand-strong); background: var(--brand-soft);
    padding: 2px 8px; border-radius: 10px; font-weight:600;
  }

  .empty { padding: 60px 0; text-align:center; color:var(--muted); grid-column: 1 / -1; }
  .pool-empty { padding:80px 32px; text-align:center; color:var(--muted); }

  /* ===== Modal ===== */
  .modal-backdrop {
    position:fixed; inset:0; background: rgba(15,15,30,.55);
    backdrop-filter: blur(4px);
    display:none; align-items:flex-start; justify-content:center; z-index:1000;
    padding: 40px 20px; overflow-y:auto;
  }
  .modal-backdrop.open { display:flex; }
  .modal {
    background:#fff; width: 100%; max-width: 880px;
    border-radius:18px; overflow:hidden;
    box-shadow: var(--shadow-lg);
    animation: modalIn .18s ease-out;
  }
  @keyframes modalIn {
    from { transform: translateY(12px) scale(.98); opacity:0; }
    to { transform: none; opacity:1; }
  }
  .modal-head {
    display:flex; justify-content:space-between; align-items:center;
    padding: 16px 22px;
    background: linear-gradient(135deg, var(--grad-a), var(--grad-b));
    color:#fff;
  }
  .modal-head h2 { margin:0; font-size:16px; font-weight:600; letter-spacing:.3px; }
  .modal-close {
    background: rgba(255,255,255,.2); color:#fff; border:0;
    width:32px; height:32px; border-radius:10px; font-size:18px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition: background .12s;
  }
  .modal-close:hover { background: rgba(255,255,255,.34); }
  .modal-body {
    display:grid; grid-template-columns: 340px 1fr; gap:22px; padding:22px;
  }
  @media (max-width: 720px) {
    .modal-body { grid-template-columns: 1fr; }
  }
  .modal-cover {
    width: 100%; aspect-ratio: 1/1; border-radius:14px; overflow:hidden;
    background:#F2F0F7; position:relative;
    border: 1px solid var(--line-soft);
  }
  .modal-cover img { width:100%; height:100%; object-fit:cover; display:block; }
  .modal-cover .noimg {
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#bbb; font-size:13px;
  }
  .modal-info h3 {
    margin:0 0 12px; font-size:16px; line-height:1.45; color: var(--ink);
  }
  .kv-grid {
    display:grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap:10px 20px;
    margin-bottom: 16px;
  }
  .kv { display:flex; flex-direction:column; gap:2px; font-size:12px; }
  .kv .k { color: var(--muted); font-size:11px; }
  .kv .v { color: var(--ink); font-weight:500; word-break: break-all; }
  .kv .v.price { color: var(--p0); font-weight:700; font-size:15px; }
  .modal-tags { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px; }
  .country-table-wrap {
    margin-top: 8px; border: 1px solid var(--line);
    border-radius:12px; overflow:hidden;
  }
  .country-table-wrap .title {
    padding: 10px 14px; background: var(--brand-soft); color: var(--brand-strong);
    font-size:13px; font-weight:600;
    display:flex; align-items:center; justify-content:space-between;
  }
  .country-table {
    width:100%; border-collapse: collapse; font-size:12px;
  }
  .country-table th, .country-table td {
    padding: 9px 14px; text-align:left; border-top:1px solid var(--line-soft);
  }
  .country-table th {
    background:#FAFAFC; color: var(--muted); font-weight:600; font-size:11px;
    text-transform: uppercase; letter-spacing:.5px;
  }
  .country-table td.country { font-weight:600; color: var(--brand-strong); width: 120px; }
  .country-table td a { color: var(--brand-strong); font-weight:600; }
  .country-table td a:hover { text-decoration: underline; }
  .country-table tr.current td { background: #FFF8FA; }
</style>
</head>
<body>

<header class="hero">
  <div class="hero-row">
    <div>
      <h1>🔥 男装 P0 丰富度货盘</h1>
    </div>
    <div class="hero-actions">
      <button id="btn-export">📤 导出 Excel</button>
      <button class="ghost" id="btn-upload" title="预留">上传明细</button>

<div class="tabs">

<div class="filters-wrap">

    <div class="filter-field search-field"><input class="search" id="q" placeholder="🔍 搜索 商品ID / 商品名 / 类目 / 店铺" /><label>关键词搜索</label></div>
    <div class="filter-field"><select id="f-country"><option value="">全部国家</option></select><label>国家（SPU集合）</label></div>

<section class="stats">

<main id="content" class="grid"></main>

<!-- Modal -->
<div class="modal-backdrop" id="modal-bd">
  <div class="modal" id="modal">
    <div class="modal-head">
      <h2>商品详情</h2>
      <button class="modal-close" id="modal-close" aria-label="关闭">×</button>
    </div>
    <div class="modal-body" id="modal-body"></div>

<script>
const CSV_URL = "data.csv?ts=" + Date.now();
const SPU_PID_MAP_URL = "spu_country_pid_map.csv?ts=" + Date.now();

let ALL = [];              // 全量 P0 池商品（主列表保持不变）
let PICKED = new Set();    // 圈品池 pid
let TAB = "pool";
let SPU_MAP = new Map();   // spu_code -> [rows...]   多国 PID 聚合（优先使用全量宽表补全映射）
let SPU_COUNTRIES = new Map(); // spu_code -> Set(country)   SPU 覆盖国家集合
let COUNTRIES_IN_DATA = []; // 补全映射中出现过的国家（用于筛选与导出列头）
let PID_DETAIL_MAP = new Map(); // product_id -> P0 池行；补全 PID 若不在 P0 池，价格/库存显示 -

// 国家中文名映射（用于导出表头 + Modal 展示）
const COUNTRY_CN = {
  US: "美国", GB: "英国", MX: "墨西哥", DE: "德国",
  FR: "法国", ES: "西班牙", IT: "意大利", JP: "日本",
  BR: "巴西", CA: "加拿大", AU: "澳大利亚", ID: "印尼",
  TH: "泰国", VN: "越南", MY: "马来西亚", PH: "菲律宾",
  SG: "新加坡", SA: "沙特", AE: "阿联酋"
};
function countryCN(code){ return COUNTRY_CN[code] || code || "-"; }

// ---------- CSV 解析 ----------
function parseCSV(text) {
  const rows = [];
  let cur = "", row = [], inQ = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQ) {
      if (ch === '"' && text[i+1] === '"') { cur += '"'; i++; }
      else if (ch === '"') { inQ = false; }
      else cur += ch;
    } else {
      if (ch === '"') inQ = true;
      else if (ch === ',') { row.push(cur); cur = ""; }
      else if (ch === '\n') { row.push(cur); rows.push(row); row = []; cur = ""; }
      else if (ch === '\r') { /* skip */ }
      else cur += ch;
    }
  }
  if (cur.length || row.length) { row.push(cur); rows.push(row); }
  if (!rows.length) return [];
  const header = rows.shift();
  return rows.filter(r => r.length && r.some(v => v !== "")).map(r => {
    const o = {};
    header.forEach((h, i) => o[h] = r[i] ?? "");
    return o;
  });
}

// ---------- 工具 ----------
function uniqSorted(arr) {
  return [...new Set(arr.filter(x => x && x !== "" && x !== "nan"))].sort();
}
function fillSelect(id, values) {
  const sel = document.getElementById(id);
  const cur = sel.value;
  const head = sel.querySelector("option");
  sel.innerHTML = "";
  sel.appendChild(head);
  values.forEach(v => {
    const o = document.createElement("option");
    o.value = v; o.textContent = v;
    sel.appendChild(o);
  });
  sel.value = cur;
}
function esc(v) {
  return String(v == null ? "" : v)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}

// ---------- 按 SPU 聚合多国 PID ----------
function buildPidDetailMap(rows) {
  return new Map(rows.filter(r => r.product_id).map(r => [String(r.product_id), r]));
}
function normalizeSpuPidRows(mapRows, fallbackRows) {
  const sourceRows = (mapRows && mapRows.length) ? mapRows : fallbackRows;
  const seen = new Set();
  const rows = [];
  sourceRows.forEach(r => {
    const spu = (r.spu_code || "").trim();
    const country = (r.country || "").trim().toUpperCase();
    const pid = String(r.product_id || "").trim();
    if (!spu || !country || !pid) return;
    const key = `${spu}|${country}|${pid}`;
    if (seen.has(key)) return;
    seen.add(key);
    const detail = PID_DETAIL_MAP.get(pid) || {};
    rows.push({
      ...detail,
      spu_code: spu,
      country,
      product_id: pid,
      deal_price: detail.deal_price || "",
      stock: detail.stock || "",
      _hasP0Detail: Boolean(detail.product_id),
    });
  });
  return rows;
}
function buildSpuMap(rows) {
  const m = new Map();
  rows.forEach(r => {
    if (!r.spu_code) return;
    if (!m.has(r.spu_code)) m.set(r.spu_code, []);
    m.get(r.spu_code).push(r);
  });
  return m;
}
function buildSpuCountries(rows) {
  const m = new Map();
  rows.forEach(r => {
    if (!r.spu_code) return;
    if (!m.has(r.spu_code)) m.set(r.spu_code, new Set());
    if (r.country) m.get(r.spu_code).add(r.country);
  });
  return m;
}
function getSpuCountries(spuCode, fallbackCountry) {
  const set = SPU_COUNTRIES.get(spuCode);
  const countries = set && set.size ? [...set] : [fallbackCountry].filter(Boolean);
  return countries.sort();
}
// 上架国家展示：主力国明确列出，欧洲新开国合并为"+N 个欧洲新开国"
const MAIN_COUNTRIES_ORDER = ["US","GB","DE","FR","IT","ES","MX"];
const EU_EXTRA_COUNTRIES = new Set(["NL","PL","GR","AT","PT","CZ","HU","BE"]);
function formatListedCountries(countries) {
  const set = new Set(countries);
  const mains = MAIN_COUNTRIES_ORDER.filter(c => set.has(c));
  const euExtra = [...set].filter(c => EU_EXTRA_COUNTRIES.has(c));
  const others = [...set].filter(c => !MAIN_COUNTRIES_ORDER.includes(c) && !EU_EXTRA_COUNTRIES.has(c));
  const parts = [...mains];
  if (euExtra.length) parts.push(`+${euExtra.length} 个欧洲新开国`);
  if (others.length) parts.push(...others);
  return { text: parts.join(" · "), tooltip: [...set].sort().join(", ") };
}

const FILTER_OPTIONS = {
  listing: ["近 7 天", "近 30 天", "近 90 天", "90 天以上", "未知"],
  price: ["< $10", "$10 - $30", "$30 - $60", "$60 +", "未知"],
  stock: ["有货", "缺货"],
  score: ["≥ 4.5", "4.0 - 4.5", "< 4.0", "无评分"],
  sps: ["≥ 4.5 优质", "4.0 - 4.5 良好", "< 4.0 一般", "无评分"],
  yesNo: ["是", "否"]
};

function numVal(v) {
  if (v == null || String(v).trim() === "") return NaN;
  const n = Number(String(v).replace(/[$,]/g, ""));
  return Number.isFinite(n) ? n : NaN;
}
function listingBucket(r) {
  const s = (r.first_success_audit_date || "").trim();
  if (!/^\d{4}-\d{2}-\d{2}$/.test(s)) return "未知";
  const d = new Date(s + "T00:00:00");
  if (Number.isNaN(d.getTime())) return "未知";
  const today = new Date(); today.setHours(0,0,0,0);
  const days = Math.floor((today - d) / 86400000);
  if (days < 0) return "未知";
  if (days <= 7) return "近 7 天";
  if (days <= 30) return "近 30 天";
  if (days <= 90) return "近 90 天";
  return "90 天以上";
}
function priceBucket(r) {
  const n = numVal(r.deal_price);
  if (!Number.isFinite(n)) return "未知";
  if (n < 10) return "< $10";
  if (n < 30) return "$10 - $30";
  if (n < 60) return "$30 - $60";
  return "$60 +";
}
function stockBucket(r) { return numVal(r.stock) > 0 ? "有货" : "缺货"; }
function scoreBucket(r) {
  const n = numVal(r.final_score);
  if (!Number.isFinite(n) || n <= 0) return "无评分";
  if (n >= 4.5) return "≥ 4.5";
  if (n >= 4.0) return "4.0 - 4.5";
  return "< 4.0";
}
function spsBucket(r) {
  const n = numVal(r.shop_sps_score);
  if (!Number.isFinite(n) || n <= 0) return "无评分";
  if (n >= 4.5) return "≥ 4.5 优质";
  if (n >= 4.0) return "4.0 - 4.5 良好";
  return "< 4.0 一般";
}
function yesNoBucket(v) { return String(v).trim() === "1" ? "是" : "否"; }

// ---------- 筛选 ----------
function filterRows() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  const c = document.getElementById("f-country").value;
  const c2 = document.getElementById("f-cat2").value;
  const c3 = document.getElementById("f-cat3").value;
  const v = document.getElementById("f-video").value;
  const g = document.getElementById("f-gpm").value;
  const listing = document.getElementById("f-listing").value;
  const price = document.getElementById("f-price").value;
  const stock = document.getElementById("f-stock").value;
  const score = document.getElementById("f-score").value;
  const sps = document.getElementById("f-sps").value;
  const jit = document.getElementById("f-jit").value;
  return ALL.filter(r => {
    if (c && !(SPU_COUNTRIES.get(r.spu_code) || new Set([r.country])).has(c)) return false;
    if (c2 && r.second_category_name !== c2) return false;
    if (c3 && r.third_category_name !== c3) return false;
    if (listing && listingBucket(r) !== listing) return false;
    if (price && priceBucket(r) !== price) return false;
    if (stock && stockBucket(r) !== stock) return false;
    if (score && scoreBucket(r) !== score) return false;
    if (sps && spsBucket(r) !== sps) return false;
    if (jit && yesNoBucket(r.has_jit_sku) !== jit) return false;
    if (v && r["短视频占比区间"] !== v) return false;
    if (g && r["GPM分层"] !== g) return false;
    if (q) {
      const hay = [r.product_id, r.spu_code, r.product_name, r.shop_name, r.third_category_name, r.second_category_name]
        .join(" ").toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

function renderPool() {
  const rows = filterRows();
  document.getElementById("st-total").textContent = rows.length.toLocaleString();
  document.getElementById("st-country").textContent = new Set(rows.map(r => r.country)).size;
  document.getElementById("st-spu").textContent = new Set(rows.map(r => r.spu_code)).size.toLocaleString();

  const container = document.getElementById("content");
  container.className = "grid";
  if (TAB === "picked") {
    const picked = ALL.filter(r => PICKED.has(r.product_id));
    if (!picked.length) {
      container.innerHTML = `<div class="pool-empty">圈品池为空，去商品池挑选吧～</div>`;
      return;
    }
    container.innerHTML = picked.map((r,i) => cardHTML(r,i)).join("");
    return;
  }
  if (!rows.length) {
    container.innerHTML = `<div class="empty">没有匹配的商品</div>`;
    return;
  }
  container.innerHTML = rows.map((r,i) => cardHTML(r,i)).join("");
}

function syncPickedCount() {
  document.getElementById("picked-count").textContent = PICKED.size;
}

function updatePickUI(pickEl, isPicked) {
  pickEl.classList.toggle("on", isPicked);
  pickEl.textContent = isPicked ? "已选" : "Select";
  const card = pickEl.closest(".card");
  if (card) card.classList.toggle("picked", isPicked);
}

function togglePicked(pid, pickEl) {
  const isPicked = !PICKED.has(pid);
  if (isPicked) PICKED.add(pid); else PICKED.delete(pid);
  syncPickedCount();

  if (TAB === "picked" && !isPicked) {
    const card = pickEl.closest(".card");
    if (card) card.remove();
    if (!PICKED.size) {
      document.getElementById("content").innerHTML = `<div class="pool-empty">圈品池为空，去商品池挑选吧～</div>`;
    }
    return;
  }
  updatePickUI(pickEl, isPicked);
}

function bindEvents() {
  document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
    t.classList.add("active");
    TAB = t.dataset.tab;
    renderPool();
  }));
  ["q","f-country","f-cat2","f-cat3","f-listing","f-price","f-stock","f-score","f-sps","f-jit","f-video","f-gpm"].forEach(id => {
    document.getElementById(id).addEventListener("input", renderPool);
    document.getElementById(id).addEventListener("change", renderPool);
  });

  // 卡片点击：区分 Select / PID 链接 / 打开 Modal
  document.getElementById("content").addEventListener("click", e => {
    const pickEl = e.target.closest("[data-pick]");
    if (pickEl) {
      e.stopPropagation();
      const pid = pickEl.getAttribute("data-pick");
      togglePicked(pid, pickEl);
      return;
    }
    if (e.target.closest("a")) return; // PID 链接不触发 Modal
    const card = e.target.closest(".card");
    if (card) openModal(card.getAttribute("data-pid"));
  });

  document.getElementById("btn-pick-all").addEventListener("click", () => {
    filterRows().forEach(r => PICKED.add(r.product_id));
    document.getElementById("picked-count").textContent = PICKED.size;
    renderPool();
  });
  document.getElementById("btn-pick-clear").addEventListener("click", () => {
    PICKED.clear();
    document.getElementById("picked-count").textContent = 0;
    renderPool();
  });
  document.getElementById("btn-refresh").addEventListener("click", () => location.reload());
  document.getElementById("btn-reset").addEventListener("click", () => {
    ["q","f-country","f-cat2","f-cat3","f-listing","f-price","f-stock","f-score","f-sps","f-jit","f-video","f-gpm"].forEach(id => {
      document.getElementById(id).value = "";
    });
    renderPool();
  });
  document.getElementById("btn-export").addEventListener("click", exportCSV);

  // Modal 关闭
  document.getElementById("modal-close").addEventListener("click", closeModal);
  document.getElementById("modal-bd").addEventListener("click", e => {
    if (e.target.id === "modal-bd") closeModal();
  });
  document.addEventListener("keydown", e => {
    if (e.key === "Escape") closeModal();
  });
}

// 基础列（当前行维度）
const EXPORT_COLUMNS = [
  ["spu_code",             "SPU编码"],
  ["product_id",           "商品ID(PID·当前行)"],
  ["country",              "国家(当前行)"],
  ["product_name",         "商品名称"],
  ["shop_name",            "店铺名称"],
  ["shop_sps_score",       "店铺SPS分"],
  ["second_category_name", "二级类目"],
  ["third_category_name",  "三级类目"],
  ["deal_price",           "到手价(USD)"],
  ["stock",                "库存"],
  ["final_score",          "商品评分"],
  ["P0丰富度标签",         "P0丰富度标签"],
  ["GPM分层",              "GPM分层"],
  ["短视频占比区间",       "短视频占比区间"],
  ["first_success_audit_date", "首次上架日期"],
  ["has_jit_sku",          "是否JIT"],
  ["has_combo_sku",        "是否组合SKU"],
  ["rank",                 "榜单排名"],
];

function csvEscape(v) {
  const s = v == null ? "" : String(v);
  if (/[,"\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
  return s;
}

function exportCSV() {
  // 1. 当前筛选（或圈品池）行集合
  const baseRows = TAB === "picked"
    ? ALL.filter(r => PICKED.has(r.product_id))
    : filterRows();
  if (!baseRows.length) { alert("当前没有可导出的商品"); return; }

  // 2. 涉及的国家列（按全量 data.csv 的国家顺序）
  const countryCols = COUNTRIES_IN_DATA.slice();

  // 3. 表头
  const header = [
    ...EXPORT_COLUMNS.map(([, cn]) => cn),
    ...countryCols.map(c => `${countryCN(c)}PID(${c})`),
    "SPU覆盖国家数",
    "SPU下PID总数",
  ];

  // 4. 每行输出：以当前行为基准，把该 SPU 下各国 PID 展开（同国多 PID 用 , 拼接）
  const bodyLines = baseRows.map(r => {
    const group = SPU_MAP.get(r.spu_code) || [r];
    const byCountry = {};
    group.forEach(g => {
      const c = g.country || "";
      if (!c) return;
      (byCountry[c] = byCountry[c] || []).push(g.product_id);
    });
    const spuCountryCount = Object.keys(byCountry).length;
    const spuPidCount = group.length;

    const line = [
      ...EXPORT_COLUMNS.map(([k]) => csvEscape(r[k])),
      ...countryCols.map(c => csvEscape((byCountry[c] || []).join(","))),
      csvEscape(spuCountryCount),
      csvEscape(spuPidCount),
    ];
    return line.join(",");
  });

  const csv = "\ufeff" + header.join(",") + "\n" + bodyLines.join("\n");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `men_p0_export_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

  fetch(SPU_PID_MAP_URL, { cache: "no-store" }).then(r => r.ok ? r.text() : "").catch(() => ""),
]).then(([txt, mapTxt]) => {
  ALL = parseCSV(txt);
  PID_DETAIL_MAP = buildPidDetailMap(ALL);
  const fullMapRows = normalizeSpuPidRows(parseCSV(mapTxt), ALL);
  SPU_MAP = buildSpuMap(fullMapRows);
  SPU_COUNTRIES = buildSpuCountries(fullMapRows);
  COUNTRIES_IN_DATA = uniqSorted(fullMapRows.map(r => r.country));

  fillSelect("f-country", COUNTRIES_IN_DATA);
  fillSelect("f-cat2", uniqSorted(ALL.map(r => r.second_category_name)));
  fillSelect("f-cat3", uniqSorted(ALL.map(r => r.third_category_name)));
  fillSelect("f-video", ["<30%", "30-50%", "50-70%", "70%+", "未知"]);
  fillSelect("f-gpm", ["高GPM", "中GPM", "低GPM"]);
  fillSelect("f-listing", FILTER_OPTIONS.listing);
  fillSelect("f-price", FILTER_OPTIONS.price);
  fillSelect("f-stock", FILTER_OPTIONS.stock);
  fillSelect("f-score", FILTER_OPTIONS.score);
  fillSelect("f-sps", FILTER_OPTIONS.sps);
  fillSelect("f-jit", FILTER_OPTIONS.yesNo);

  document.getElementById("datacsv-stamp").textContent =
    `data.csv + spu_country_pid_map.csv · 更新于 ${new Date().toLocaleString("zh-CN", { hour12: false })}`;
  bindEvents();
  renderPool();
}).catch(e => {
  document.getElementById("content").innerHTML = `<div class="empty">加载数据失败：${e}</div>`;
});
</script>
</body>
</html>
