<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>男装高增速补贴倾斜P0商品推荐池</title>
<style>
  :root {
    /* 紫粉渐变主题 */
    --grad-a:#6D5BD0;
    --grad-b:#E85D75;
    --brand-strong:#4A3AA0;
    --brand-soft:#EEEAFB;
    --ink:#1B1B2E;
    --ink-soft:#4A4A63;
    --muted:#7F7F95;
    --line:#E5E4EE;
    --line-soft:#EFEEF5;
    --bg:#F5F5F8;
    --card:#FFFFFF;
    --p0:#E85D75;
    --gpm:#6D5BD0;
    --aff:#00B894;
    --hot:#ff6a00;
    --sps-bg:#FFF2E8;
    --sps-fg:#C85D23;
    --shadow-sm: 0 1px 2px rgba(27,27,46,.05), 0 1px 3px rgba(27,27,46,.04);
    --shadow-md: 0 4px 14px rgba(74,58,160,.08), 0 2px 6px rgba(27,27,46,.05);
    --shadow-lg: 0 20px 50px rgba(27,27,46,.22), 0 6px 18px rgba(27,27,46,.12);
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
                 "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    background: var(--bg);
  }
  a { color: inherit; text-decoration: none; }

  /* ===== Header (紫粉渐变) ===== */
  .hero {
    position: relative;
    background: linear-gradient(135deg, var(--grad-a) 0%, var(--grad-b) 100%);
    padding: 34px 40px 40px;
    color:#fff;
    overflow:hidden;
  }
  .hero::before {
    content:""; position:absolute; inset:0;
    background:
      radial-gradient(circle at 15% 20%, rgba(255,255,255,.18), transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(255,255,255,.12), transparent 45%);
    pointer-events:none;
  }
  .hero-row {
    position:relative; z-index:1;
    display:flex; justify-content:space-between; align-items:flex-end;
    gap:24px; flex-wrap:wrap;
  }
  .hero h1 {
    margin:0; font-size:30px; letter-spacing:.5px; font-weight:700;
    text-shadow: 0 2px 8px rgba(0,0,0,.15);
  }
  .hero .sub { margin-top:8px; font-size:13px; opacity:.9; letter-spacing:.3px; }
  .hero-actions { display:flex; gap:10px; flex-wrap:wrap; }
  .hero-actions button {
    background: rgba(255,255,255,.95); color: var(--brand-strong);
    border:0; border-radius:10px;
    padding:10px 18px; font-size:13px; font-weight:600; cursor:pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,.12);
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .hero-actions button:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(0,0,0,.18); }
  .hero-actions button.ghost {
    background: rgba(255,255,255,.14); color:#fff; backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,.35);
  }

  /* ===== Tabs ===== */
  .tabs {
    display:flex; gap:24px; padding: 0 40px;
    background:#fff; border-bottom:1px solid var(--line);
    box-shadow: var(--shadow-sm);
  }
  .tab {
    padding:14px 4px; font-size:14px; color:var(--muted); cursor:pointer;
    border-bottom:3px solid transparent; transition: color .15s;
  }
  .tab:hover { color: var(--ink-soft); }
  .tab.active { color: var(--brand-strong); border-bottom-color: var(--grad-a); font-weight:600; }
  .tab .badge {
    display:inline-block; min-width:20px; padding:0 6px; margin-left:4px;
    background: var(--brand-soft); color: var(--brand-strong);
    border-radius:10px; font-size:11px; font-weight:600; text-align:center;
  }

  /* ===== Filter bar (卡片式) ===== */
  .filters-wrap { padding: 20px 40px 0; position: relative; z-index: 1; }
  .filters {
    background:rgba(255,255,255,.92); padding: 16px 18px; border-radius:18px;
    display:flex; gap:12px; align-items:flex-end; flex-wrap:wrap;
    box-shadow: var(--shadow-md); border:1px solid rgba(109,91,208,.08);
    backdrop-filter: blur(14px);
  }
  .filter-field { display:flex; flex-direction:column; gap:5px; flex: 0 1 146px; min-width:130px; }
  .filter-field.search-field { flex: 1 1 300px; min-width:240px; }
  .filter-field label { font-size:11px; color:#6b6683; line-height:1; padding-left:2px; font-weight:600; }
  .filter-hint { flex: 1 1 100%; font-size:12px; color:#777; margin-top:-4px; line-height:1.6; background:#FAF9FE; border:1px dashed #E3DFF4; border-radius:10px; padding:8px 10px; }
  .filters input, .filters select {
    width:100%; height:40px; border:1px solid var(--line); border-radius:11px; padding: 0 12px;
    font-size:13px; background:#fff; color:var(--ink); outline:none;
    transition: border-color .15s, box-shadow .15s, transform .12s;
  }
  .filters input:hover, .filters select:hover { border-color: rgba(109,91,208,.38); }
  .filters input:focus, .filters select:focus {
    border-color: var(--grad-a);
    box-shadow: 0 0 0 3px rgba(109,91,208,.15);
    transform: translateY(-1px);
  }
  .filters select { padding-right: 28px; cursor:pointer; }
  .filters select.native-hidden {
    position:absolute; opacity:0; pointer-events:none; width:0; height:0; padding:0; border:0;
  }
  .multi-select {
    position:relative;
  }
  .multi-select-trigger {
    width:100%; min-height:40px; border:1px solid var(--line); border-radius:11px; padding: 8px 34px 8px 12px;
    font-size:13px; background:#fff; color:var(--ink); cursor:pointer;
    display:flex; align-items:center; gap:6px; flex-wrap:wrap; line-height:1.3;
    transition: border-color .15s, box-shadow .15s, transform .12s;
  }
  .multi-select:hover .multi-select-trigger { border-color: rgba(109,91,208,.38); }
  .multi-select.open .multi-select-trigger {
    border-color: var(--grad-a);
    box-shadow: 0 0 0 3px rgba(109,91,208,.15);
    transform: translateY(-1px);
  }
  .multi-select-trigger::after {
    content:"▾"; position:absolute; right:12px; top:50%; transform:translateY(-50%);
    color:var(--muted); font-size:12px;
  }
  .multi-select-summary { color: var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
  .multi-select-tag {
    display:inline-flex; align-items:center; max-width:100%;
    padding:2px 8px; border-radius:999px; background:var(--brand-soft); color:var(--brand-strong);
    font-size:11px; font-weight:600;
  }
  .multi-select-panel {
    position:absolute; left:0; right:0; top: calc(100% + 8px); z-index:30;
    background:#fff; border:1px solid var(--line); border-radius:12px; box-shadow: var(--shadow-md);
    padding:8px; display:none; max-height:260px; overflow:auto;
  }
  .multi-select.open .multi-select-panel { display:block; }
  .multi-select-option {
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    width:100%; border:0; background:#fff; border-radius:10px; padding:9px 10px; cursor:pointer;
    color:var(--ink); font-size:13px; text-align:left;
  }
  .multi-select-option:hover { background:#F7F5FD; }
  .multi-select-option.active { background:var(--brand-soft); color:var(--brand-strong); font-weight:600; }
  .multi-select-option .check { color:transparent; font-size:12px; }
  .multi-select-option.active .check { color:var(--grad-a); }
  .filters .refresh, .filters .reset {
    color:#fff; border:0; padding: 0 18px; height:38px; border-radius:10px;
    font-weight:600; font-size:13px; cursor:pointer;
    transition: transform .12s, box-shadow .12s;
  }
  .filters .refresh {
    background: linear-gradient(135deg, var(--grad-a), var(--grad-b));
    box-shadow: 0 2px 8px rgba(109,91,208,.35);
  }
  .filters .reset {
    background:#fff; color:var(--brand-strong); border:1px solid var(--line);
  }
  .filters .refresh:hover, .filters .reset:hover { transform: translateY(-1px); }
  .filters .reset:hover { border-color:var(--grad-a); background:var(--brand-soft); }
  .filters .datacsv { margin-left:auto; color:var(--muted); font-size:12px; padding-bottom:10px; }

  /* ===== Sub actions ===== */
  .sub-actions {
    display:flex; gap:10px; padding: 14px 40px 0;
  }
  .sub-actions button {
    background:#fff; border:1px solid var(--line); padding: 7px 14px; border-radius:8px;
    font-size:12px; cursor:pointer; color: var(--ink-soft);
    transition: background .12s, border-color .12s;
  }
  .sub-actions button:hover { background: var(--brand-soft); border-color: var(--grad-a); color: var(--brand-strong); }

  /* ===== Stat cards ===== */
  .stats { display:grid; grid-template-columns: repeat(4, 1fr); gap:14px; padding: 18px 40px; }
  .stat {
    background:#fff; border-radius:14px; padding: 16px 20px;
    box-shadow: var(--shadow-sm);
    display:flex; flex-direction: column; gap:4px;
    border: 1px solid var(--line-soft);
    position: relative; overflow:hidden;
  }
  .stat::before {
    content:""; position:absolute; left:0; top:0; bottom:0; width:4px;
    background: linear-gradient(180deg, var(--grad-a), var(--grad-b));
    opacity:.85;
  }
  .stat .num { font-size:26px; font-weight:700; color: var(--ink); }
  .stat .num.small { font-size:15px; font-weight:700; color: var(--brand-strong); }
  .stat .label { color: var(--muted); font-size:12px; }

  /* ===== Product grid ===== */
  .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap:12px; padding: 0 32px 36px; }
  .card {
    background:#fff; border:1px solid var(--line-soft); border-radius:12px; overflow:hidden;
    display:flex; flex-direction:column; cursor: pointer;
    transition: transform .18s ease, box-shadow .2s ease, border-color .18s, background .18s;
  }
  .card:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 28px rgba(44,39,90,.14);
    border-color: rgba(109,91,208,.42);
  }
  .card:active { transform: translateY(-1px) scale(.995); }
  .card.picked {
    border-color: rgba(109,91,208,.78);
    background: linear-gradient(180deg, #fff, #FCFAFF);
    box-shadow: 0 0 0 2px rgba(109,91,208,.16), var(--shadow-sm);
  }
  .card .cover {
    position:relative;
    width:100%;
    aspect-ratio: 1 / 1;
    background:#F2F0F7;
    overflow:hidden;
  }
  @supports not (aspect-ratio: 1 / 1) {
    .card .cover { height: 0; padding-top: 100%; }
  }
  .card .cover img {
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit: cover; display:block;
    background:#F2F0F7;
  }
  .card .cover .noimg {
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    color:#bbb; font-size:12px;
    background:#F2F0F7;
  }
  .card .cover .badges { position:absolute; left:8px; top:8px; display:flex; gap:6px; flex-wrap:wrap; }
  .card .cover .select {
    position:absolute; right:10px; top:10px;
    min-width:78px; height:34px;
    display:inline-flex; align-items:center; justify-content:center;
    background: rgba(27,27,46,.78); color:#fff; font-size:13px; font-weight:700;
    padding: 0 12px; border-radius: 18px; cursor:pointer;
    box-shadow: 0 6px 16px rgba(20,18,45,.18);
    backdrop-filter: blur(8px);
    transition: transform .12s ease, box-shadow .12s ease, background .12s ease;
    touch-action: manipulation;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .card .cover .select:hover { transform: scale(1.04); box-shadow: 0 8px 20px rgba(20,18,45,.24); }
  .card .cover .select:active { transform: scale(.98); }
  .card .cover .select.on { background: linear-gradient(135deg, var(--grad-a), var(--grad-b)); }
  .card .body { padding: 10px 12px 12px; display:flex; flex-direction:column; gap:6px; font-size:12px; color: var(--ink-soft); }
  .card .body .lbl { color: var(--muted); margin-right:4px; }
  .card .pid-line { font-size:12px; }
  .card .pid-line a { font-weight:600; color: var(--brand-strong); }
  .card .pid-line a:hover { text-decoration: underline; }
  .card .pname {
    font-size:12px; color: var(--ink); line-height:1.4; font-weight:500;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
    overflow:hidden; text-overflow:ellipsis;
  }
  .card .shop, .card .cat { font-size:12px; color: var(--ink-soft); }
  .card .price-row { display:flex; align-items:center; justify-content:space-between; }
  .card .price b { color: var(--p0); font-size:15px; font-weight:700; }
  .card .tags { display:flex; gap:4px; flex-wrap:wrap; }
  .tag {
    display:inline-block; font-size:11px; padding: 2px 8px; border-radius:10px;
    background: var(--line-soft); color: var(--ink-soft); white-space: nowrap;
  }
  .tag.p0 { background: #FDECEF; color: var(--p0); font-weight:600; }
  .tag.gpm-hi { background: #EAE5FA; color: var(--gpm); font-weight:600; }
  .tag.gpm-mid { background: #EFEAFB; color: #7A6ED5; }
  .tag.gpm-lo { background: #EFEEF5; color: var(--muted); }
  .tag.aff { background: #E5F8F0; color: var(--aff); }
  .tag.rank { background: var(--ink); color:#fff; font-weight:700; }
  .tag.sps {
    background: var(--sps-bg); color: var(--sps-fg); border-radius:3px;
    padding:1px 5px; font-size:11px; border:0;
  }
  .tag.sps b { font-weight:600; }
  .tag.vid { background:#F3EAFC; color:#8A2BE2; }
  .tag.sales { background:#EAF7F2; color:#0D7A4E; font-weight:600; }
  .tag.growth { background:#FFEAF1; color:#C2185B; font-weight:600; }
  .tag.jit { background:#E8F4FF; color:#1E6EEB; font-weight:600; }
  .tag.combo { background:#FFF3D6; color:#B87B00; font-weight:600; }
  .card .foot { font-size:11px; color: var(--muted); }
  .card .country-lines { display:flex; flex-direction:column; gap:3px; font-size:12px; }
  .card .listed-countries { color: var(--muted); font-size:11px; line-height:1.35; }
  .card .listed-countries .lbl { font-size:11px; }
  .card .current-country { color: var(--brand-strong); font-weight:600; }
  .card .current-country .lbl { color: var(--brand-strong); }
  .card .rank-line { font-size:12px; color: var(--ink-soft); display:flex; gap:6px; align-items:center; }
  .card .multi-country {
    display:inline-flex; align-items:center; gap:4px;
    font-size:11px; color: var(--brand-strong); background: var(--brand-soft);
    padding: 2px 8px; border-radius: 10px; font-weight:600;
  }

  .empty { padding: 60px 0; text-align:center; color:var(--muted); grid-column: 1 / -1; }
  .pool-empty { padding:80px 32px; text-align:center; color:var(--muted); }
  .load-more-wrap { grid-column: 1 / -1; display:flex; justify-content:center; padding: 10px 0 4px; }

  /* ---------- 首屏 Loading / Skeleton ---------- */
  .loading-bar {
    position: sticky; top: 0; z-index: 50;
    background: rgba(255,255,255,.86);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line-soft);
    padding: 10px 14px;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .loading-bar .msg { color: var(--ink-soft); font-size: 13px; }
  .loading-bar .prog { color: var(--muted); font-size: 12px; }
  .skeleton-grid {
    grid-column: 1 / -1;
    display:grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 12px;
  }
  @media (max-width: 1200px) { .skeleton-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (max-width: 920px) { .skeleton-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 560px) { .skeleton-grid { grid-template-columns: repeat(1, minmax(0, 1fr)); } }
  .skeleton-card {
    border-radius: 16px;
    background: #fff;
    border: 1px solid var(--line-soft);
    box-shadow: var(--shadow-sm);
    overflow:hidden;
  }
  .sk-cover { height: 190px; background: linear-gradient(90deg, #f1effa 25%, #ffffff 37%, #f1effa 63%); background-size: 400% 100%; animation: sk 1.4s ease infinite; }
  .sk-body { padding: 12px; }
  .sk-line { height: 12px; border-radius: 8px; background: linear-gradient(90deg, #f1effa 25%, #ffffff 37%, #f1effa 63%); background-size: 400% 100%; animation: sk 1.4s ease infinite; margin: 10px 0; }
  .sk-line.sm { width: 55%; }
  .sk-line.md { width: 78%; }
  .sk-line.lg { width: 92%; }
  @keyframes sk { 0%{background-position:100% 50%} 100%{background-position:0 50%} }
  .load-more { border:none; border-radius:999px; padding:11px 22px; background:linear-gradient(135deg,#7c3aed,#ec4899); color:#fff; font-weight:800; cursor:pointer; box-shadow:0 10px 22px rgba(124,58,237,.18); transition: transform .14s ease, box-shadow .14s ease; }
  .load-more:hover { transform: translateY(-1px); box-shadow:0 14px 28px rgba(124,58,237,.24); }
  .load-more:active { transform: translateY(0) scale(.98); }

  /* ===== Modal ===== */
  .modal-backdrop {
    position:fixed; inset:0; background: rgba(15,15,30,.55);
    backdrop-filter: blur(4px);
    display:none; align-items:flex-start; justify-content:center; z-index:1000;
    padding: 40px 20px; overflow-y:auto;
  }
  .modal-backdrop.open { display:flex; }
  .modal {
    background:#fff; width: 100%; max-width: 880px;
    border-radius:18px; overflow:hidden;
    box-shadow: var(--shadow-lg);
    animation: modalIn .18s ease-out;
  }
  @keyframes modalIn {
    from { transform: translateY(12px) scale(.98); opacity:0; }
    to { transform: none; opacity:1; }
  }
  .modal-head {
    display:flex; justify-content:space-between; align-items:center;
    padding: 16px 22px;
    background: linear-gradient(135deg, var(--grad-a), var(--grad-b));
    color:#fff;
  }
  .modal-head h2 { margin:0; font-size:16px; font-weight:600; letter-spacing:.3px; }
  .modal-close {
    background: rgba(255,255,255,.2); color:#fff; border:0;
    width:32px; height:32px; border-radius:10px; font-size:18px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition: background .12s;
  }
  .modal-close:hover { background: rgba(255,255,255,.34); }
  .modal-body {
    display:grid; grid-template-columns: 340px 1fr; gap:22px; padding:22px;
  }
  @media (max-width: 720px) {
    .modal-body { grid-template-columns: 1fr; }
  }
  .modal-cover {
    width: 100%; aspect-ratio: 1/1; border-radius:14px; overflow:hidden;
    background:#F2F0F7; position:relative;
    border: 1px solid var(--line-soft);
  }
  .modal-cover img { width:100%; height:100%; object-fit:cover; display:block; }
  .modal-cover .noimg {
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#bbb; font-size:13px;
  }
  .modal-info h3 {
    margin:0 0 12px; font-size:16px; line-height:1.45; color: var(--ink);
  }
  .kv-grid {
    display:grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap:10px 20px;
    margin-bottom: 16px;
  }
  .kv { display:flex; flex-direction:column; gap:2px; font-size:12px; }
  .kv .k { color: var(--muted); font-size:11px; }
  .kv .v { color: var(--ink); font-weight:500; word-break: break-all; }
  .kv .v.price { color: var(--p0); font-weight:700; font-size:15px; }
  .modal-tags { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px; }
  .country-table-wrap {
    margin-top: 8px; border: 1px solid var(--line);
    border-radius:12px; overflow:hidden;
  }
  .country-table-wrap .title {
    padding: 10px 14px; background: var(--brand-soft); color: var(--brand-strong);
    font-size:13px; font-weight:600;
    display:flex; align-items:center; justify-content:space-between;
  }
  .country-table {
    width:100%; border-collapse: collapse; font-size:12px;
  }
  .country-table th, .country-table td {
    padding: 9px 14px; text-align:left; border-top:1px solid var(--line-soft);
  }
  .country-table th {
    background:#FAFAFC; color: var(--muted); font-weight:600; font-size:11px;
    text-transform: uppercase; letter-spacing:.5px;
  }
  .country-table td.country { font-weight:600; color: var(--brand-strong); width: 120px; }
  .country-table td a { color: var(--brand-strong); font-weight:600; }
  .country-table td a:hover { text-decoration: underline; }
  .country-table tr.current td { background: #FFF8FA; }

  /* ===== 综合体验优化覆盖：更清晰、更适合高密度选品 ===== */
  .stats { gap:16px; }
  .stat { border-radius:18px; padding:18px 20px 14px; background:linear-gradient(135deg,#fff 0%,#FBFAFF 100%); border-color:rgba(109,91,208,.08); }
  .stat::after { content:""; position:absolute; right:-28px; top:-28px; width:88px; height:88px; border-radius:50%; background:rgba(109,91,208,.07); }
  .stat .num { font-size:28px; font-weight:800; letter-spacing:-.02em; }
  .stat .label { font-weight:600; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(236px, 1fr)); gap:16px; padding-bottom:28px; }
  .card { border-radius:18px; border-color:rgba(109,91,208,.08); box-shadow:0 8px 22px rgba(27,27,46,.05); transition:transform .16s ease, box-shadow .16s ease, border-color .16s ease; }
  .card:hover { transform:translateY(-3px); box-shadow:0 14px 34px rgba(74,58,160,.13); border-color:rgba(109,91,208,.22); }

<script>
// ===== 数据加载：优先同源，其次 raw.githubusercontent.com / jsdelivr 兜底 =====
const REPO_SLUG = "xqx1568-source/product_recommend1";

function baseDirUrl() {
  const p = location.pathname || "/";
  // 1) /repo/  -> /repo/
  // 2) /repo/index.html -> /repo/
  // 3) /repo  -> /repo/  （避免用户复制少了结尾 / 导致相对路径错位）
  let dir = p;
  if (dir.endsWith("/")) {
    // ok
  } else {
    const last = dir.split("/").pop() || "";
    if (last.includes(".")) {
      dir = dir.slice(0, dir.lastIndexOf("/") + 1);
    } else {
      dir = dir + "/";
    }
  }
  return location.origin + dir;
}

function withTs(url) {
  return url + (url.includes("?") ? "&" : "?") + "ts=" + Date.now();
}

const BASE_DIR = baseDirUrl();
const CSV_URLS = [
  withTs(BASE_DIR + "data.csv"),
  withTs(`https://raw.githubusercontent.com/${REPO_SLUG}/main/docs/data.csv`),
  withTs(`https://cdn.jsdelivr.net/gh/${REPO_SLUG}@main/docs/data.csv`),
];
const SPU_PID_MAP_URLS = [
  withTs(BASE_DIR + "spu_country_pid_map.csv"),
  withTs(`https://raw.githubusercontent.com/${REPO_SLUG}/main/docs/spu_country_pid_map.csv`),
  withTs(`https://cdn.jsdelivr.net/gh/${REPO_SLUG}@main/docs/spu_country_pid_map.csv`),
];

async function fetchFirstText(urls, opts) {
  const tried = [];
  for (const u of urls) {
    tried.push(u);
    try {
      const r = await fetch(u, opts);
      if (r.ok) return { text: await r.text(), url: u };
    } catch (e) {
      // ignore
    }
  }
  const err = new Error("Failed to fetch");
  err.tried = tried;
  throw err;
}

let ALL = [];              // 全量 P0 池商品（主列表保持不变）
let PICKED = new Set();    // 圈品池 pid
let TAB = "pool";
const INITIAL_RENDER = 70;     // 首屏加载卡片数
const LOAD_MORE_STEP = 200;    // 每次点击“加载更多”追加数
let DISPLAY_LIMIT = INITIAL_RENDER;
let SPU_MAP = new Map();   // spu_code -> [rows...]   多国 PID 聚合（优先使用全量宽表补全映射）
let SPU_COUNTRIES = new Map(); // spu_code -> Set(country)   SPU 覆盖国家集合
let COUNTRIES_IN_DATA = []; // 补全映射中出现过的国家（用于筛选与导出列头）
let PID_DETAIL_MAP = new Map(); // product_id -> P0 池行；补全 PID 若不在 P0 池，价格/库存显示 -

// 国家中文名映射（用于导出表头 + Modal 展示）
const COUNTRY_CN = {
  US: "美国", GB: "英国", MX: "墨西哥", DE: "德国",
  FR: "法国", ES: "西班牙", IT: "意大利",
  BR: "巴西", CA: "加拿大", AU: "澳大利亚", ID: "印尼",
  TH: "泰国", VN: "越南", MY: "马来西亚", PH: "菲律宾",
  SG: "新加坡", AE: "阿联酋"
};
function countryCN(code){ return COUNTRY_CN[code] || code || "-"; }

// ---------- CSV 解析 ----------
function parseCSV(text) {
  const rows = [];
  let cur = "", row = [], inQ = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQ) {
      if (ch === '"' && text[i+1] === '"') { cur += '"'; i++; }
      else if (ch === '"') { inQ = false; }
      else cur += ch;
    } else {
      if (ch === '"') inQ = true;
      else if (ch === ',') { row.push(cur); cur = ""; }
      else if (ch === '\n') { row.push(cur); rows.push(row); row = []; cur = ""; }
      else if (ch === '\r') { /* skip */ }
      else cur += ch;
    }
  }
  if (cur.length || row.length) { row.push(cur); rows.push(row); }
  if (!rows.length) return [];
  const header = rows.shift();
  return rows.filter(r => r.length && r.some(v => v !== "")).map(r => {
    const o = {};
    header.forEach((h, i) => o[h] = r[i] ?? "");
    return o;
  });
}

// ---------- 工具 ----------
function uniqSorted(arr) {
  return [...new Set(arr.filter(x => x && x !== "" && x !== "nan"))].sort();
}
function fillSelect(id, values) {
  const sel = document.getElementById(id);
  const cur = selectedValues(id);
  const head = sel.querySelector("option") || document.createElement("option");
  const placeholder = head.textContent || sel.dataset.placeholder || "全部";
  head.value = "";
  head.textContent = placeholder;
  sel.innerHTML = "";
  sel.appendChild(head);
  values.forEach(v => {
    const o = document.createElement("option");
    o.value = v; o.textContent = v;
    o.selected = cur.includes(v);
    sel.appendChild(o);
  });
  if (!sel.multiple) {
    sel.value = cur[0] || "";
  }
  refreshMultiSelect(id);
}
function esc(v) {
  return String(v == null ? "" : v)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}
function closeAllMultiSelects(exceptId = "") {
  document.querySelectorAll(".multi-select.open").forEach(node => {
    if (node.dataset.selectId !== exceptId) node.classList.remove("open");
  });
}
function renderMultiSelectSummary(selectEl, trigger) {
  const values = [...selectEl.selectedOptions].map(o => o.value).filter(Boolean);
  const placeholder = selectEl.dataset.placeholder || (selectEl.querySelector('option[value=""]') || {}).textContent || "全部";
  if (!values.length) {
    trigger.innerHTML = `<span class="multi-select-summary">${esc(placeholder)}</span>`;
    return;
  }
  const tags = values.slice(0, 2).map(v => `<span class="multi-select-tag">${esc(v)}</span>`).join("");
  const extra = values.length > 2 ? `<span class="multi-select-tag">+${values.length - 2}</span>` : "";
  trigger.innerHTML = tags + extra;
}
function refreshMultiSelect(id) {
  const selectEl = document.getElementById(id);
  const box = selectEl && selectEl.nextElementSibling && selectEl.nextElementSibling.classList.contains("multi-select")
    ? selectEl.nextElementSibling : null;
  if (!selectEl || !box) return;
  const trigger = box.querySelector(".multi-select-trigger");
  const panel = box.querySelector(".multi-select-panel");
  renderMultiSelectSummary(selectEl, trigger);
  panel.innerHTML = [...selectEl.options]
    .filter(o => o.value)
    .map(o => `<button type="button" class="multi-select-option ${o.selected ? 'active' : ''}" data-value="${esc(o.value)}"><span>${esc(o.textContent)}</span><span class="check">✓</span></button>`)
    .join("");
}
function initMultiSelect(id) {
  const selectEl = document.getElementById(id);
  if (!selectEl || !selectEl.multiple || (selectEl.nextElementSibling && selectEl.nextElementSibling.classList.contains("multi-select"))) return;
  selectEl.classList.add("native-hidden");
  const box = document.createElement("div");
  box.className = "multi-select";
  box.dataset.selectId = id;
  box.innerHTML = '<button type="button" class="multi-select-trigger"></button><div class="multi-select-panel"></div>';
  selectEl.insertAdjacentElement("afterend", box);
  const trigger = box.querySelector(".multi-select-trigger");
  const panel = box.querySelector(".multi-select-panel");
  trigger.addEventListener("click", e => {
    e.stopPropagation();
    const willOpen = !box.classList.contains("open");
    closeAllMultiSelects(willOpen ? id : "");
    box.classList.toggle("open", willOpen);
  });
  panel.addEventListener("click", e => {
    const btn = e.target.closest(".multi-select-option");
    if (!btn) return;
    e.stopPropagation();
    const value = btn.dataset.value;
    const opt = [...selectEl.options].find(o => o.value === value);
    if (!opt) return;
    opt.selected = !opt.selected;
    refreshMultiSelect(id);
    selectEl.dispatchEvent(new Event("change", { bubbles: true }));
  });
  refreshMultiSelect(id);
}

// ---------- 按 SPU 聚合多国 PID ----------
function buildPidDetailMap(rows) {
  return new Map(rows.filter(r => r.product_id).map(r => [String(r.product_id), r]));
}
function normalizeSpuPidRows(mapRows, fallbackRows) {
  const sourceRows = (mapRows && mapRows.length) ? mapRows : fallbackRows;
  const seen = new Set();
  const rows = [];
  sourceRows.forEach(r => {
    const spu = (r.spu_code || "").trim();
    const country = (r.country || "").trim().toUpperCase();
    const pid = String(r.product_id || "").trim();
    if (!spu || !country || !pid) return;
    const key = `${spu}|${country}|${pid}`;
    if (seen.has(key)) return;
    seen.add(key);
    const detail = PID_DETAIL_MAP.get(pid) || {};
    rows.push({
      ...detail,
      spu_code: spu,
      country,
      product_id: pid,
      deal_price: detail.deal_price || "",
      stock: detail.stock || "",
      _hasP0Detail: Boolean(detail.product_id),
    });
  });
  return rows;
}
function buildSpuMap(rows) {
  const m = new Map();
  rows.forEach(r => {
    if (!r.spu_code) return;
    if (!m.has(r.spu_code)) m.set(r.spu_code, []);
    m.get(r.spu_code).push(r);
  });
  return m;
}
function buildSpuCountries(rows) {
  const m = new Map();
  rows.forEach(r => {
    if (!r.spu_code) return;
    if (!m.has(r.spu_code)) m.set(r.spu_code, new Set());
    if (r.country) m.get(r.spu_code).add(r.country);
  });
  return m;
}
function getSpuCountries(spuCode, fallbackCountry) {
  const set = SPU_COUNTRIES.get(spuCode);
  const countries = set && set.size ? [...set] : [fallbackCountry].filter(Boolean);
  return countries.sort();
}
// 上架国家展示：主力国明确列出，欧洲新开国合并为"+N 个欧洲新开国"
const MAIN_COUNTRIES_ORDER = ["US","GB","DE","FR","IT","ES","MX"];
const EU_EXTRA_COUNTRIES = new Set(["NL","PL","GR","AT","PT","CZ","HU","BE"]);
function formatListedCountries(countries) {
  const set = new Set(countries);
  const mains = MAIN_COUNTRIES_ORDER.filter(c => set.has(c));
  const euExtra = [...set].filter(c => EU_EXTRA_COUNTRIES.has(c));
  const others = [...set].filter(c => !MAIN_COUNTRIES_ORDER.includes(c) && !EU_EXTRA_COUNTRIES.has(c));
  const parts = [...mains];
  if (euExtra.length) parts.push(`+${euExtra.length} 个欧洲新开国`);
  if (others.length) parts.push(...others);
  return { text: parts.join(" · "), tooltip: [...set].sort().join(", ") };
}

const FILTER_OPTIONS = {
  listing: ["近 7 天", "近 30 天", "近 90 天", "90 天以上", "未知"],
  price: ["< $10", "$10 - $30", "$30 - $60", "$60 +", "未知"],
  stock: ["有货", "缺货"],
  yesNo: ["是", "否"]
};

// 评分分段：只展示“区间段”，不使用“大于/小于”类文案
const RATING_BINS = [5.0, 4.5, 4.0, 3.5, 3.0, 0.0];
const RATING_BUCKET_ORDER = [
  "5.0~4.5",
  "4.5~4.0",
  "4.0~3.5",
  "3.5~3.0",
  "3.0~0.0",
];

function numVal(v) {
  if (v == null || String(v).trim() === "") return NaN;
  const n = Number(String(v).replace(/[$,]/g, ""));
  return Number.isFinite(n) ? n : NaN;
}
function listingBucket(r) {
  const s = (r.first_success_audit_date || "").trim();
  if (!/^\d{4}-\d{2}-\d{2}$/.test(s)) return "未知";
  const d = new Date(s + "T00:00:00");
  if (Number.isNaN(d.getTime())) return "未知";
  const today = new Date(); today.setHours(0,0,0,0);
  const days = Math.floor((today - d) / 86400000);
  if (days < 0) return "未知";
  if (days <= 7) return "近 7 天";
  if (days <= 30) return "近 30 天";
  if (days <= 90) return "近 90 天";
  return "90 天以上";
}
function priceBucket(r) {
  const n = numVal(r.deal_price);
  if (!Number.isFinite(n)) return "未知";
  if (n < 10) return "< $10";
  if (n < 30) return "$10 - $30";
  if (n < 60) return "$30 - $60";
  return "$60 +";
}
function stockBucket(r) { return numVal(r.stock) > 0 ? "有货" : "缺货"; }
function bucketByBins(n) {
  if (!Number.isFinite(n) || n <= 0) return "无评分";
  // clamp
  const x = Math.min(5.0, n);
  for (let i = 0; i < RATING_BINS.length - 1; i++) {
    const hi = RATING_BINS[i];
    const lo = RATING_BINS[i + 1];
    // 半开区间：(lo, hi] 让 4.0 落在 4.0~3.5，4.5 落在 4.5~4.0
    if (x <= hi && x > lo) {
      return `${hi.toFixed(1)}~${lo.toFixed(1)}`;
    }
  }
  return "无评分";
}

function spsBucket(r) {
  return bucketByBins(numVal(r.shop_sps_score));
}

function buildRatingOptions(getBucketFn) {
  const cnt = new Map();
  ALL.forEach(r => {
    const b = getBucketFn(r);
    cnt.set(b, (cnt.get(b) || 0) + 1);
  });
  const out = RATING_BUCKET_ORDER.filter(b => (cnt.get(b) || 0) > 0);
  if ((cnt.get("无评分") || 0) > 0) out.push("无评分");
  return out;
}

function growthBucket(r) {
  const g = (r["增速分级"] || "").trim();
  if (!g) return "无分级";
  if (g === "高增长") return "高增速";
  if (g === "中增长") return "中增速";
  if (g === "增长") return "增长";
  return g;
}
function yesNoBucket(v) { return String(v).trim() === "1" ? "是" : "否"; }

function salesLabel(r, field) {
  const v = String(r[field] || "").trim();
  return v || "未知";
}
function salesSortValue(r, field) {
  const n = numVal(r[field]);
  return Number.isFinite(n) ? n : 0;
}
function sortRows(rows) {
  const sortKey = document.getElementById("f-sort") ? (document.getElementById("f-sort").value || "sales_7d_desc") : "sales_7d_desc";
  const sorted = rows.slice();
  const dir = sortKey.endsWith("_asc") ? 1 : -1;
  const field = sortKey.includes("7d") ? "_近7天销量排序值" : (sortKey.includes("1d") ? "_近1天销量排序值" : "_近3天销量排序值");
  sorted.sort((a, b) => {
    const diff = salesSortValue(a, field) - salesSortValue(b, field);
    if (diff !== 0) return diff * dir;
    return numVal(a.rank) - numVal(b.rank);
  });
  return sorted;
}

// ---------- 筛选 ----------
function selectedValues(id) {
  const el = document.getElementById(id);
  if (!el) return [];
  if (el.multiple) return [...el.selectedOptions].map(o => o.value).filter(Boolean);
  return el.value ? [el.value] : [];
}

function filterRows() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  const mc = selectedValues("f-main-country");
  const lc = selectedValues("f-listed-country");
  const c2 = selectedValues("f-cat2");
  const c3 = selectedValues("f-cat3");
  const v = selectedValues("f-video");
  const sales7d = selectedValues("f-sales7d");
  const sales1d = selectedValues("f-sales1d");
  const sales3d = selectedValues("f-sales3d");
  const g = selectedValues("f-gpm");
  const listing = selectedValues("f-listing");
  const price = selectedValues("f-price");
  const stock = selectedValues("f-stock");
  const growth = selectedValues("f-growth");
  const buyer = selectedValues("f-buyer");
  const sps = selectedValues("f-sps");
  const jit = selectedValues("f-jit");
  const rows = ALL.filter(r => {
    if (mc.length && !mc.includes(r.country)) return false;
    if (lc.length && !lc.some(country => (SPU_COUNTRIES.get(r.spu_code) || new Set([r.country])).has(country))) return false;
    if (c2.length && !c2.includes(r.second_category_name)) return false;
    if (c3.length && !c3.includes(r.third_category_name)) return false;
    if (listing.length && !listing.includes(listingBucket(r))) return false;
    if (price.length && !price.includes(priceBucket(r))) return false;
    if (stock.length && !stock.includes(stockBucket(r))) return false;
    if (growth.length && !growth.includes(growthBucket(r))) return false;
    if (buyer.length && !buyer.includes(String(r["买手"] || "").trim())) return false;
    if (sps.length && !sps.includes(spsBucket(r))) return false;
    if (jit.length && !jit.includes(yesNoBucket(r.has_jit_sku))) return false;
    if (v.length && !v.includes(r["短视频占比区间"])) return false;
    if (sales7d.length && !sales7d.includes(salesLabel(r, "近7天销量分档"))) return false;
    if (sales1d.length && !sales1d.includes(salesLabel(r, "近1天销量"))) return false;
    if (sales3d.length && !sales3d.includes(salesLabel(r, "近3天销量"))) return false;
    if (g.length && !g.includes(r["GPM分层"])) return false;
    if (q) {
      const hay = [r.product_id, r.spu_code, r.product_name, r.shop_name, r.third_category_name, r.second_category_name]
        .join(" ").toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  return sortRows(rows);
}

function gpmClass(v) {
  if (v === "高GPM") return "gpm-hi";
  if (v === "中GPM") return "gpm-mid";
  return "gpm-lo";
}

// ---------- 渲染 ----------
function renderPool() {
  const rows = filterRows();
  document.getElementById("st-total").textContent = rows.length.toLocaleString();
  document.getElementById("st-country").textContent = new Set(rows.map(r => r.country)).size;
  document.getElementById("st-spu").textContent = new Set(rows.map(r => r.spu_code)).size.toLocaleString();

  const container = document.getElementById("content");
  container.className = "grid";
  if (TAB === "picked") {
    const picked = ALL.filter(r => PICKED.has(r.product_id));
    if (!picked.length) {
      container.innerHTML = `<div class="pool-empty">圈品池为空，去商品池挑选吧～</div>`;
      return;
    }
    const visiblePicked = picked.slice(0, DISPLAY_LIMIT);
    const moreHTML = picked.length > visiblePicked.length
      ? `<div class="load-more-wrap"><button class="load-more" id="btn-load-more">加载更多圈品（已显示 ${visiblePicked.length.toLocaleString()} / ${picked.length.toLocaleString()}）</button></div>`
      : "";
    container.innerHTML = visiblePicked.map((r,i) => cardHTML(r,i)).join("") + moreHTML;
    return;
  }
  if (!rows.length) {
    container.innerHTML = `<div class="empty">没有匹配的商品</div>`;
    return;
  }
  const visibleRows = rows.slice(0, DISPLAY_LIMIT);
  const moreHTML = rows.length > visibleRows.length
    ? `<div class="load-more-wrap"><button class="load-more" id="btn-load-more">加载更多商品（已显示 ${visibleRows.length.toLocaleString()} / ${rows.length.toLocaleString()}）</button></div>`
    : "";
  container.innerHTML = visibleRows.map((r,i) => cardHTML(r,i)).join("") + moreHTML;
}

function syncPickedCount() {
  document.getElementById("picked-count").textContent = PICKED.size;
}

function updatePickUI(pickEl, isPicked) {
  pickEl.classList.toggle("on", isPicked);
  pickEl.textContent = "Select";
  const card = pickEl.closest(".card");
  if (card) card.classList.toggle("picked", isPicked);
}

function togglePicked(pid, pickEl) {
  const isPicked = !PICKED.has(pid);
  if (isPicked) PICKED.add(pid); else PICKED.delete(pid);
  syncPickedCount();

  if (TAB === "picked" && !isPicked) {
    const card = pickEl.closest(".card");
    if (card) card.remove();
    if (!PICKED.size) {
      document.getElementById("content").innerHTML = `<div class="pool-empty">圈品池为空，去商品池挑选吧～</div>`;
    }
    return;
  }
  updatePickUI(pickEl, isPicked);
}

function bindEvents() {
  document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
    t.classList.add("active");
    TAB = t.dataset.tab;
    DISPLAY_LIMIT = INITIAL_RENDER;
    renderPool();
  }));
  ["f-main-country","f-listed-country","f-cat2","f-cat3","f-listing","f-price","f-stock","f-growth","f-buyer","f-sps","f-jit","f-video","f-sales7d","f-sales1d","f-sales3d","f-gpm"].forEach(initMultiSelect);
  ["q","f-main-country","f-listed-country","f-cat2","f-cat3","f-listing","f-price","f-stock","f-growth","f-buyer","f-sps","f-jit","f-video","f-sales7d","f-sales1d","f-sales3d","f-gpm","f-sort"].forEach(id => {
    const rerender = () => { DISPLAY_LIMIT = INITIAL_RENDER; renderPool(); };
    document.getElementById(id).addEventListener("input", rerender);
    document.getElementById(id).addEventListener("change", rerender);
  });
  document.addEventListener("click", e => {
    if (!e.target.closest(".multi-select")) closeAllMultiSelects();
  });

  const contentEl = document.getElementById("content");

  // Select：用 pointerdown 提前触发，提升响应速度（避免 click 延迟/等待）
  contentEl.addEventListener("pointerdown", e => {
    const pickEl = e.target.closest("[data-pick]");
    if (!pickEl) return;
    e.preventDefault();
    e.stopPropagation();
    const pid = pickEl.getAttribute("data-pick");
    togglePicked(pid, pickEl);
  }, { passive: false });

  // 卡片 click：区分 PID 链接 / 打开 Modal（pick 已在 pointerdown 处理）
  contentEl.addEventListener("click", e => {
    if (e.target.closest("#btn-load-more")) {
      DISPLAY_LIMIT += LOAD_MORE_STEP;
      renderPool();
      return;
    }
    if (e.target.closest("[data-pick]")) { e.stopPropagation(); return; }
    if (e.target.closest("a")) return; // PID 链接不触发 Modal
    const card = e.target.closest(".card");
    if (card) openModal(card.getAttribute("data-pid"));
  });

  document.getElementById("btn-pick-all").addEventListener("click", () => {
    filterRows().forEach(r => PICKED.add(r.product_id));
    document.getElementById("picked-count").textContent = PICKED.size;
    renderPool();
  });
  document.getElementById("btn-pick-clear").addEventListener("click", () => {
    PICKED.clear();
    document.getElementById("picked-count").textContent = 0;
    renderPool();
  });
  document.getElementById("btn-refresh").addEventListener("click", () => location.reload());
  document.getElementById("btn-reset").addEventListener("click", () => {
    ["q","f-main-country","f-listed-country","f-cat2","f-cat3","f-listing","f-price","f-stock","f-growth","f-buyer","f-sps","f-jit","f-video","f-sales7d","f-sales1d","f-sales3d","f-gpm","f-sort"].forEach(id => {
      const el = document.getElementById(id);
      if (el.multiple) {
        [...el.options].forEach(opt => { opt.selected = false; });
        refreshMultiSelect(id);
      } else {
        el.value = "";
      }
    });
    closeAllMultiSelects();
    DISPLAY_LIMIT = INITIAL_RENDER;
    renderPool();
  });
  document.getElementById("btn-export").addEventListener("click", exportCSV);
  document.getElementById("btn-export-img").addEventListener("click", () => { exportExcelWithImages(); });

  // Modal 关闭
  document.getElementById("modal-close").addEventListener("click", closeModal);
  document.getElementById("modal-bd").addEventListener("click", e => {
    if (e.target.id === "modal-bd") closeModal();
  });
  document.addEventListener("keydown", e => {
    if (e.key === "Escape") closeModal();
  });
}

  if (EXPORT_VALUE_FIELDS.has(k)) return salesLabel(r, k);
  return r[k];
}

function csvEscape(v) {
  const s = v == null ? "" : String(v);
  if (/[,"\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
  return s;
}

function getExportBaseRows() {
  return TAB === "picked"
    ? ALL.filter(r => PICKED.has(r.product_id))
    : filterRows();
}

function buildExpandedPidByCountry(spuCode, fallbackRow) {
  const group = SPU_MAP.get(spuCode) || [fallbackRow];
  const byCountry = {};
  group.forEach(g => {
    const c = g.country || "";
    if (!c) return;
    (byCountry[c] = byCountry[c] || []).push(g.product_id);
  });
  return { byCountry, spuCountryCount: Object.keys(byCountry).length, spuPidCount: group.length };
}

  const baseRows = getExportBaseRows();

  // 2. 涉及的国家列（按全量 data.csv 的国家顺序）
  const countryCols = COUNTRIES_IN_DATA.slice();

  // 3. 表头
  const header = [
    ...EXPORT_COLUMNS.map(([, cn]) => cn),
    ...countryCols.map(c => `${countryCN(c)}PID(${c})`),
    "SPU覆盖国家数",
    "SPU下PID总数",
  ];

  // 4. 每行输出：以当前行为基准，把该 SPU 下各国 PID 展开（同国多 PID 用 , 拼接）
  const bodyLines = baseRows.map(r => {
    const { byCountry, spuCountryCount, spuPidCount } = buildExpandedPidByCountry(r.spu_code, r);
    const line = [
      ...EXPORT_COLUMNS.map(([k]) => csvEscape(exportValue(r, k))),
      ...countryCols.map(c => csvEscape((byCountry[c] || []).join(","))),
      csvEscape(spuCountryCount),
      csvEscape(spuPidCount),
    ];
    return line.join(",");
  });

  const csv = "\ufeff" + header.join(",") + "\n" + bodyLines.join("\n");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `men_p0_export_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

async function fetchImageAsData(url) {
  // 可能会遇到跨域限制：失败时返回 null
  try {
    const r = await fetch(url, { mode: "cors" });
    if (!r.ok) return null;
    const ct = (r.headers.get("content-type") || "").toLowerCase();
    const ab = await r.arrayBuffer();
    let ext = "jpeg";
    if (ct.includes("png")) ext = "png";
    else if (ct.includes("webp")) ext = "webp";
    else if (ct.includes("gif")) ext = "gif";
    else if (ct.includes("jpg") || ct.includes("jpeg")) ext = "jpeg";
    return { buffer: ab, extension: ext };
  } catch (e) {
    return null;
  }
}

async function exportExcelWithImages() {
  const baseRows = getExportBaseRows();
  if (!baseRows.length) { alert("当前没有可导出的商品"); return; }

  // 太多行会非常慢（需要下载图片）；这里自动降级为普通导出
  const HARD_CAP = 200;
  if (baseRows.length > HARD_CAP) {
    alert(`当前要导出 ${baseRows.length} 行，含图片导出会非常慢，已自动改为普通导出（不含图片）。建议先圈品后在圈品池导出。`);
    exportCSV();
    return;
  }

  if (typeof ExcelJS === "undefined") {
    alert("Excel 导出组件加载失败，请刷新页面后重试");
    return;
  }

  const wb = new ExcelJS.Workbook();
  const ws = wb.addWorksheet("商品池");

  // 列设计：图片列 + 文字列（不放敏感数值）
  const baseHeaders = [
    ["img", "商品图片"],
    ...EXPORT_COLUMNS,
  ];

  ws.columns = baseHeaders.map(([k, cn]) => {
    if (k === "img") return { header: cn, key: k, width: 16 };
    if (k === "product_name") return { header: cn, key: k, width: 40 };
    if (k === "shop_name") return { header: cn, key: k, width: 22 };
    return { header: cn, key: k, width: 14 };
  });

  // 表头行
  ws.getRow(1).font = { bold: true };
  ws.getRow(1).alignment = { vertical: "middle", horizontal: "center" };
  ws.getRow(1).height = 20;

  // 数据行
  for (let i = 0; i < baseRows.length; i++) {
    const r = baseRows[i];
    const rowIndex = i + 2;
    const rowObj = {};
    EXPORT_COLUMNS.forEach(([k]) => { rowObj[k] = exportValue(r, k) == null ? "" : String(exportValue(r, k)); });
    ws.addRow({ img: "", ...rowObj });

    // 行高：给图片留空间
    ws.getRow(rowIndex).height = 70;
    ws.getRow(rowIndex).alignment = { vertical: "middle", wrapText: true };

    // 插图
    const imgUrl = (r.image_url || "").trim();
    if (imgUrl) {
      const imgData = await fetchImageAsData(imgUrl);
      if (imgData) {
        const imgId = wb.addImage({ buffer: imgData.buffer, extension: imgData.extension });
        // 放在 A 列对应行
        ws.addImage(imgId, {
          tl: { col: 0.15, row: rowIndex - 1 + 0.1 },
          ext: { width: 90, height: 90 }
        });
      } else {
        // 跨域失败：保底在图片列写链接
        ws.getCell(`A${rowIndex}`).value = imgUrl;
        ws.getCell(`A${rowIndex}`).font = { color: { argb: "FF1E6EEB" }, underline: true };
      }
    }
  }

  // 冻结表头
  ws.views = [{ state: "frozen", ySplit: 1 }];

  const buf = await wb.xlsx.writeBuffer();
  const blob = new Blob([buf], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `men_p0_export_with_images_${new Date().toISOString().slice(0,10)}.xlsx`;
  a.click();
  URL.revokeObjectURL(url);
}

// ---------- Load（异步 Fetch + 分批解析，优化首屏阻塞） ----------
function skeletonHTML(n = INITIAL_RENDER) {
  const cards = Array.from({ length: n }).map(() => {
    return `
      <div class="skeleton-card">
        <div class="sk-cover"></div>
        <div class="sk-body">
          <div class="sk-line lg"></div>
          <div class="sk-line md"></div>
          <div class="sk-line sm"></div>
          <div class="sk-line md"></div>
        </div>
      </div>
    `;
  }).join("");
  return `<div class="loading-bar" id="loading-bar"><div class="msg" id="loading-msg">正在加载数据…</div><div class="prog" id="loading-prog">0%</div></div><div class="skeleton-grid">${cards}</div>`;
}
function setLoading(msg = "正在加载数据…", prog = "") {
  const m = document.getElementById("loading-msg");
  const p = document.getElementById("loading-prog");
  if (m) m.textContent = msg;
  if (p) p.textContent = prog;
}
function hideLoading() {
  const bar = document.getElementById("loading-bar");
  if (bar) bar.remove();
}
async function fetchFirstResponse(urls, opts = {}) {
  const tried = [];
  for (const url of urls) {
    tried.push(url);
    try {
      const r = await fetch(url, opts);
      if (r && r.ok) return { resp: r, url };
    } catch (e) {
      // ignore
    }
  }
  const err = new Error("Failed to fetch");
  err.tried = tried;
  throw err;
}
function waitNextFrame() {
  return new Promise(r => requestAnimationFrame(() => r()));
}
async function streamParseCSV(resp, onBatch) {
  if (!resp.body || !resp.body.getReader) {
    // 兜底：不支持 stream 的浏览器，仍然异步读完再解析（但避免同步阻塞）
    const text = await resp.text();
    const rows = parseCSV(text);
    onBatch(rows, 0, rows.length);
    return { total: rows.length };
  }
  const reader = resp.body.getReader();
  const decoder = new TextDecoder("utf-8");

  let header = null;
  let cur = "", row = [], inQ = false;
  let batch = [];
  let parsed = 0;

  const pushRow = (cells) => {
    if (!header) {
      header = cells;
      return;
    }
    if (!cells.length || !cells.some(v => v !== "")) return;
    const o = {};
    header.forEach((h, i) => { o[h] = cells[i] ?? ""; });
    batch.push(o);
    parsed++;
  };

  let buf = "";
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += decoder.decode(value, { stream: true });

    for (let i = 0; i < buf.length; i++) {
      const ch = buf[i];
      if (inQ) {
        if (ch === '"' && buf[i+1] === '"') { cur += '"'; i++; }
        else if (ch === '"') { inQ = false; }
        else cur += ch;
      } else {
        if (ch === '"') inQ = true;
        else if (ch === ',') { row.push(cur); cur = ""; }
        else if (ch === '\n') { row.push(cur); pushRow(row); row = []; cur = ""; }
        else if (ch === '\r') { /* skip */ }
        else cur += ch;
      }

      if (batch.length >= 600) {
        onBatch(batch, parsed);
        batch = [];
        await waitNextFrame();
      }
    }
    buf = "";
  }
  // flush tail
  if (cur.length || row.length) {
    row.push(cur);
    pushRow(row);
  }
  if (batch.length) onBatch(batch, parsed);
  return { total: parsed };
}

  ALL = [];

    for (const r of rows) {
      ALL.push(r);

  document.getElementById("content").innerHTML = `<div class="empty">加载数据失败：${esc(e && e.message ? e.message : e)}${tried}</div>`;
